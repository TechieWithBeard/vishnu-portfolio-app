<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Vishnu Thankappan • Senior Frontend & AI Architect</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Modern Vector Favicon & Touch Icons with Cache Buster -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=3" />
    <meta name="theme-color" content="#070a11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Native Declarative WebMCP Tools for Chrome DevTools (Application > WebMCP) -->
    <div id="webmcp-declarative-registry" style="display: none;" aria-hidden="true">
      <form id="webmcp-tool-profile" toolname="get_architect_profile" tooldescription="Retrieve Vishnu Thankappan's architect profile, contact details, and availability status">
      </form>

      <form id="webmcp-tool-experience" toolname="get_work_history" tooldescription="Retrieve Vishnu's enterprise work history at AVEVA, Maistering B.V, and ACI Logistix">
        <input type="text" name="company" toolparamdescription="Optional company name to filter (e.g. AVEVA, Maistering, ACI Logistix)" />
      </form>

      <form id="webmcp-tool-skills" toolname="search_skills" tooldescription="Search Vishnu's verified technical skills across Frontend Architecture and AI">
        <input type="text" name="keyword" toolparamdescription="Keyword to filter skills (e.g. Angular, LangGraph, TypeScript)" />
      </form>

      <form id="webmcp-tool-demos" toolname="get_live_demos" tooldescription="Retrieve all interactive AI and frontend demos with deep links and documentation">
      </form>

      <form id="webmcp-tool-ask" toolname="ask_portfolio_agent" tooldescription="Ask natural language questions about Vishnu Thankappan's experience and architecture">
        <input type="text" name="question" required toolparamdescription="Natural language question about Vishnu" />
      </form>
    </div>

    <app-root></app-root>
  </body>
</html>
