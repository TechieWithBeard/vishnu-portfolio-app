<app-header></app-header>
<main class="app-shell">
  <router-outlet></router-outlet>
</main>
<app-footer></app-footer>

<!-- Floating Cyberpunk AI Cockpit Launcher Button -->
<button
  class="floating-ai-cockpit-btn"
  (click)="toggleChat()"
  title="Ask Vishnu AI — Federated React 19 Microfrontend in Angular 22 Shell"
  aria-label="Open AI Agent Cockpit (React 19 Microfrontend)"
>
  <span class="ai-btn-pulse"></span>
  <span class="ai-btn-icon">🤖</span>
  <span class="ai-btn-text">Ask Vishnu AI</span>
  <span class="ai-btn-react-badge">⚛️ React</span>
</button>

<!-- Federated React 19 Chat Microfrontend Cockpit -->
@if (isChatOpen()) {
  <app-portfolio-chat-wrapper (close)="closeChat()"></app-portfolio-chat-wrapper>
}
