# ==============================================================================
# Render.com Blueprint — Vishnu Portfolio Deployment
# ==============================================================================

services:
  # 1. NestJS REST API Web Service
  - type: web
    name: vishnu-portfolio-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:api
    startCommand: npm run start:api:prod
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ML_SERVICE_URL
        value: https://vishnu-portfolio-ml.onrender.com

  # 2. Angular 22 Portfolio Shell (Static Site)
  - type: static
    name: vishnu-portfolio
    buildCommand: npm install && npm run build:all
    staticPublishPath: dist/apps/portfolio-shell/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. React 19 Admin Dashboard (Static Site)
  - type: static
    name: vishnu-portfolio-admin
    buildCommand: npm install && npm run build:admin
    staticPublishPath: dist/apps/portfolio-admin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 4. LangGraph Python ML Service (FastAPI)
  - type: web
    name: vishnu-portfolio-ml
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn techiewithbeard_ai.portfolio_agent.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
