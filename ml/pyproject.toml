[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "techiewithbeard-ai"
version = "0.1.0"
description = "AI, ML, LangChain, RAG, and agent experiments for the Techie With Beard portfolio."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "langchain>=0.2.17",
  "langchain-community>=0.2.19",
  "langchain-core>=0.2.43",
  "langchain-openai>=0.1.25",
  "python-dotenv>=1.0.1",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.5.2",
  "pypdf>=5.0.0",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.6.9",
]
notebooks = [
  "ipykernel>=6.29.5",
  "jupyter>=1.1.1",
]
streamlit = [
  "streamlit>=1.38.0",
]

[project.scripts]
twb-ai = "techiewithbeard_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
